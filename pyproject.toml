[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-os"
version = "0.1.0-prealpha"
description = "Autonomous Unified Runtime Architecture — Voice-first, AI-native operating environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AURA Core Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
voice = [
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "webrtcvad>=2.0.10",
]
vision = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
]

[project.scripts]
aura = "aura.cli:main"
aurad = "aura.core.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
